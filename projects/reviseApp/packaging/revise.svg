<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- App icon (packaging: ".desktop" gap fix — Icon=revise previously
       resolved to nothing anywhere on disk). A dark rounded-square
       backdrop plus a light glyph, deliberately mirroring the app's
       own background/text colors (see theme.rs's Palette::dark:
       #0A0A0A / #F2F2F2) rather than introducing an accent color the
       app itself doesn't use anywhere. The glyph is two overlapping
       flashcards with a couple of ruled lines, echoing the app's
       Flashcards + Notes features without needing to depict either
       literally. -->
  <rect width="128" height="128" rx="28" fill="#0A0A0A"/>
  <g fill="none" stroke="#F2F2F2" stroke-width="4.5" stroke-linejoin="round">
    <rect x="34" y="38" width="60" height="46" rx="6" opacity="0.55"/>
    <rect x="26" y="46" width="60" height="46" rx="6" fill="#0A0A0A"/>
  </g>
  <g stroke="#F2F2F2" stroke-width="4.5" stroke-linecap="round">
    <line x1="38" y1="62" x2="74" y2="62"/>
    <line x1="38" y1="74" x2="64" y2="74"/>
  </g>
</svg>
