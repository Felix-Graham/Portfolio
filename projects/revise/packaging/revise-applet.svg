<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Icon for revise-applet (the small Timer / Pomodoro / Stopwatch
       unit). Same dark rounded square and light glyph as revise.svg —
       the app's own Palette::dark colours (#0A0A0A / #F2F2F2), no
       accent — with a clock face in place of the flashcards: a ring,
       a stopwatch button on top, and a single hand with a partly drawn
       progress arc, like the ring the applet itself shows. -->
  <rect width="128" height="128" rx="28" fill="#0A0A0A"/>
  <g fill="none" stroke="#F2F2F2" stroke-width="4.5" stroke-linecap="round">
    <circle cx="64" cy="70" r="30" opacity="0.4"/>
    <path d="M64 40 A30 30 0 0 1 94 70"/>
    <line x1="64" y1="70" x2="64" y2="50"/>
    <line x1="56" y1="26" x2="72" y2="26"/>
    <line x1="64" y1="26" x2="64" y2="34"/>
  </g>
</svg>
